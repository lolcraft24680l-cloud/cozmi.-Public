name: COZMI
options:
  bundleIdPrefix: de.julian
  deploymentTarget:
    iOS: "17.0"

targets:
  COZMI:
    type: application
    platform: iOS
    sources:
      - COZMIApp.swift
      - Gemini.swift
      - Stimme.swift
      - Gesicht.swift
      - ContentView.swift
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: COZMI
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "COZMI hoert zu, damit du mit ihm sprechen kannst."
        NSSpeechRecognitionUsageDescription: "COZMI wandelt deine Sprache in Text um, um antworten zu koennen."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.julian.cozmi
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
